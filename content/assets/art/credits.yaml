# Who made each folder of illustrations in content/assets/art, and how.
# The originals (PNG/JPG) stay out of git; `npm run art` turns them into content/assets/panels/<folder>/*.webp.
# The content owner decided on 2026-10-01 to use AI-generated illustrations (an exception to the original brief,
# which asked for code-drawn art only). ECGs and the monitor close-ups stay code-drawn.

- folder: cp-01
  madeWith: ChatGPT image generation (OpenAI), from the prompts in docs/art/cp-01-prompts.md
  madeBy: Content owner
  date: 2026-10-01
  note: Stand-ins cut from a 1254 px contact sheet; to be replaced by full-size images.

- folder: cp-02
  madeWith: ChatGPT image generation (OpenAI), from the prompts in docs/art/cp-02-prompts.md
  madeBy: Content owner
  date: 2026-10-01
  note: Cut from a 1254 px contact sheet (wide panels, about 610 × 300 px).

- folder: cp-03
  madeWith: ChatGPT image generation (OpenAI), from the prompts in docs/art/cp-03-prompts.md
  madeBy: Content owner
  date: 2026-10-01
  note: Cut from a 1285 × 1224 px contact sheet (wide panels, about 620 px across), enlarged and sharpened.

