# Time targets (the Time meter) and the monitor's "abnormal" ranges (values turn red on the HUD).
# A time target runs from one milestone to another. Options stamp milestones with `milestone:`.
# "door" is stamped automatically at arrival (minute 0).

timeTargets:
  - id: door-to-ecg
    label: "Arrival to 12-lead ECG"
    from: door
    to: ecg
    targetMin: 10
    check: { source: esc-acs-2023, verified: true, reviewedOn: 2026-09-30 }

  - id: dx-to-wire
    label: "STEMI diagnosis to wire crossing (patient at a PCI centre)"
    from: stemi-dx
    to: wire
    targetMin: 60
    check: { source: esc-acs-2023, verified: true, reviewedOn: 2026-09-30 }

  - id: dx-to-lysis
    label: "STEMI diagnosis to fibrinolytic bolus"
    from: stemi-dx
    to: lysis
    targetMin: 10
    check: { source: esc-acs-2023, verified: true, reviewedOn: 2026-09-30 }

  - id: severe-bp-to-drug
    label: "Severe-range BP in pregnancy to the first antihypertensive dose"
    from: severe-bp
    to: bp-drug
    targetMin: 60
    check: { source: acog-767-2019, verified: false, todo: "ACOG: treat within 30–60 minutes of confirmed severe-range BP." }

  - id: dissection-bp-target
    label: "First IV drug to heart-rate and BP targets (aortic dissection)"
    from: bp-drug
    to: bp-target
    targetMin: 20
    check: { source: [esc-aortic-2024, esc-he-2019], verified: false }

  - id: ich-bp-target
    label: "First IV drug to target systolic BP (intracerebral haemorrhage)"
    from: bp-drug
    to: bp-target
    targetMin: 60
    check: { source: [aha-asa-ich-2022, interact3-2023], verified: false }

  - id: door-to-needle
    label: "Arrival to thrombolytic bolus (ischaemic stroke)"
    from: door
    to: lysis
    targetMin: 60
    check: { source: aha-asa-ais-2026, verified: false }

vitalLimits:
  # A value below `low` or above `high` shows in red.
  check:
    source: needs-source
    verified: true
    reviewedOn: 2026-09-30
    todo: "Choose the HUD alarm ranges (e.g. NEWS2 bands or local triage criteria) and cite them."
  hr: { low: 60, high: 100 }
  sbp: { low: 90, high: 180 }
  dbp: { low: 50, high: 110 }
  rr: { low: 12, high: 20 }
  spo2: { low: 94, high: 100 }
  gcs: { low: 15, high: 15 }
  temp: { low: 36, high: 38 }
