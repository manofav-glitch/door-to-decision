id: transcutaneous-pacing
title: "Transcutaneous pacing"
summary: "Pacing through pads on the chest: the fastest bridge to a transvenous wire in unstable bradycardia."
doses:
  - id: current
    label: "Pacing current"
    route: Demand mode, rate about 70
    text: "Increase the current until every spike is followed by a broad complex (usually 50–100 mA), then set a little above that threshold"
    check: { source: [esc-pacing-2021, erc-als-2025], verified: false, todo: "Confirm wording; no guideline gives a fixed current." }
sections:
  - heading: Pads
    body: "Anterior–posterior if you can; it captures more reliably."
  - heading: Check mechanical capture
    body: "Electrical capture on the monitor is not enough. Feel a femoral pulse at the paced rate (muscle twitching makes carotid and radial pulses unreliable) and watch the blood pressure."
  - heading: It hurts
    body: "Give analgesia and sedation to a conscious patient."
  - heading: Next
    body: "Arrange transvenous pacing; look for reversible causes: potassium, drugs (beta-blockers, calcium-channel blockers, digoxin), ischaemia."
refs: [esc-pacing-2021, erc-als-2025]
check: { source: [esc-pacing-2021, erc-als-2025], verified: false }
