id: ticagrelor
title: Ticagrelor
summary: "Reversible oral P2Y12 inhibitor. A preferred P2Y12 inhibitor with primary PCI; not the agent studied alongside fibrinolysis."
doses:
  - id: acs-loading
    label: "Loading dose, ACS"
    route: Oral
    text: "180 mg once, then 90 mg twice daily"
