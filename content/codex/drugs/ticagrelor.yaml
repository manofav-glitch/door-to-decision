sections:
  - heading: Contraindications and cautions
    body: "Previous intracranial haemorrhage; active bleeding; severe hepatic impairment; use with strong CYP3A4 inhibitors."
  - heading: With fibrinolysis
    body: "Clopidogrel is the P2Y12 inhibitor recommended with fibrinolysis."
