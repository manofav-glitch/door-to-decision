id: malignant-hypertension
title: "Malignant hypertension (acute hypertensive microangiopathy)"
summary: "Extreme BP with acute small-vessel injury: bilateral flame haemorrhages, cotton-wool spots or papilloedema, often with thrombotic microangiopathy, AKI or encephalopathy."
sections:
  - heading: Two cheap tests
    body: "Fundoscopy and a blood smear for schistocytes: the highest-yield tests, and often skipped."
  - heading: Targets
    body: "MAP down 20–25% over several hours with labetalol or nicardipine; then towards normal over 1–2 days."
  - heading: Volume
    body: "Very high BP drives salt and water loss: many are dry. No reflex diuretic; give careful fluid if dry, and keep a bolus ready when starting a vasodilator."
  - heading: RAAS block later
    body: "Once volume is restored, a low-dose oral ACE inhibitor or ARB breaks the high-renin cycle; start low and check potassium and creatinine."
  - heading: TMA or TTP?
    body: "Hypertensive TMA improves within days of BP control. Persistent low platelets or ADAMTS13 at 10% or less suggests TTP; persistent TMA with normal ADAMTS13 suggests complement-mediated aHUS. Send ADAMTS13 before plasma."
  - heading: Kidneys
    body: "Creatinine may rise at first as BP falls, then recover over weeks to months. Dialysis may be temporary: don't label end-stage kidney disease early."
  - heading: Causes
    body: "Secondary causes in 20–40%, mostly kidney disease (chronic glomerulonephritis is common in India) and renovascular disease."
