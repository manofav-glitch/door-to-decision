name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Pages serves the site at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The new home (docs/plans/paid-access-plan.md step 4b): https://app.door-to-decision.workers.dev
  cloudflare:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 89c58cc2df2100ce7ca5790111161c4a
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set yet; skipping the Cloudflare deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # With the launch switch on (.env), the build leaves paid text out of the site and writes it to
      # paid-content/, which is uploaded to Firestore before the new site goes out.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != '' && hashFiles('paid-content/manifest.json') != ''
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"; exit 1; }
          mkdir -p .secrets && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > .secrets/firebase-admin.json
          node scripts/upload-paid.ts
          rm .secrets/firebase-admin.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run site:deploy
